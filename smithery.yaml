# Smithery.ai configuration file: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      apiKey:
        type: string
        description: Optional KaijuConverter API key (kc_...) for up to 2 GB files. Leave empty for free tier (up to 25 MB per file).
      apiBase:
        type: string
        default: "https://kaijuconverter.com"
        description: Base URL for the KaijuConverter conversion API.
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['bin/kaijuconverter-mcp.js'],
      env: {
        ...(config && config.apiKey ? { KAIJU_API_KEY: config.apiKey } : {}),
        ...(config && config.apiBase ? { KAIJU_API_BASE: config.apiBase } : {})
      }
    })
