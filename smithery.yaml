# Smithery.ai configuration file: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    required: []
    properties:
      apiKey:
        type: string
        description: Optional KaijuConverter API key (kc_...) for up to 2 GB files. Leave empty for free tier (up to 25 MB per file).
      apiBase:
        type: string
        default: "https://kaijuconverter.com/api/mcp"
        description: Base URL for the KaijuConverter conversion & MCP API endpoint.
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['index.js'],
      env: {
        ...(config && config.apiKey ? { KAIJU_API_KEY: config.apiKey } : {}),
        API_ENDPOINT: 'https://kaijuconverter.com/api/mcp',
        ...(config && config.apiBase ? { KAIJU_API_BASE: config.apiBase } : { KAIJU_API_BASE: 'https://kaijuconverter.com/api/mcp' })
      }
    })
